<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg { fill: #F7F4EC; }
      .ink { fill: #151515; }
      .charcoal { fill: #2F302D; }
      .warm-grey { fill: #777066; }
      .linen { fill: #D8C7AE; }
      .gold { fill: #B9965B; }
      .brown { fill: #8A5A35; }
      .card { fill: #FFFDF8; stroke: #D8C7AE; stroke-width: 1.5; }
      .dark-card { fill: #2F302D; }
      .small { font-family: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif; font-size: 20px; letter-spacing: 0; }
      .label { font-family: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif; font-size: 17px; letter-spacing: 0; font-weight: 600; }
      .body { font-family: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif; font-size: 25px; line-height: 1.4; letter-spacing: 0; }
      .body-serif { font-family: Georgia, "Times New Roman", serif; font-size: 25px; line-height: 1.4; letter-spacing: 0; }
      .serif { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0; }
      .sans { font-family: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; }
      .heading-serif { font-family: Georgia, "Times New Roman", serif; font-size: 56px; letter-spacing: 0; font-weight: 400; }
      .heading-sans { font-family: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif; font-size: 48px; letter-spacing: 0; font-weight: 600; }
      .heading-trad { font-family: Georgia, "Times New Roman", serif; font-size: 48px; letter-spacing: 0; font-weight: 700; }
      .button-text { font-family: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif; font-size: 19px; letter-spacing: 0; font-weight: 700; }
      .muted { fill: #777066; }
      .white { fill: #F7F4EC; }
      .line { stroke: #B9965B; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1200"/>

  <text x="80" y="90" class="sans ink" font-size="22" font-weight="700">FREE STATE CURTAIN PARLOUR</text>
  <text x="80" y="152" class="serif ink" font-size="62">Text And Font Direction</text>
  <text x="80" y="196" class="body muted">Classic black and white, softened with warm showroom neutrals.</text>

  <g transform="translate(80 245)">
    <text x="0" y="0" class="label ink">Colour Scheme</text>
    <g transform="translate(0 28)">
      <rect x="0" y="0" width="145" height="86" rx="0" fill="#151515"/>
      <text x="0" y="120" class="label ink">Black</text>
      <text x="0" y="148" class="small muted">#151515</text>
    </g>
    <g transform="translate(175 28)">
      <rect x="0" y="0" width="145" height="86" rx="0" fill="#F7F4EC" stroke="#D8C7AE"/>
      <text x="0" y="120" class="label ink">Off-white</text>
      <text x="0" y="148" class="small muted">#F7F4EC</text>
    </g>
    <g transform="translate(350 28)">
      <rect x="0" y="0" width="145" height="86" rx="0" fill="#2F302D"/>
      <text x="0" y="120" class="label ink">Charcoal</text>
      <text x="0" y="148" class="small muted">#2F302D</text>
    </g>
    <g transform="translate(525 28)">
      <rect x="0" y="0" width="145" height="86" rx="0" fill="#777066"/>
      <text x="0" y="120" class="label ink">Warm Grey</text>
      <text x="0" y="148" class="small muted">#777066</text>
    </g>
    <g transform="translate(700 28)">
      <rect x="0" y="0" width="145" height="86" rx="0" fill="#D8C7AE"/>
      <text x="0" y="120" class="label ink">Linen Beige</text>
      <text x="0" y="148" class="small muted">#D8C7AE</text>
    </g>
    <g transform="translate(875 28)">
      <rect x="0" y="0" width="145" height="86" rx="0" fill="#B9965B"/>
      <text x="0" y="120" class="label ink">Soft Gold</text>
      <text x="0" y="148" class="small muted">#B9965B</text>
    </g>
    <g transform="translate(1050 28)">
      <rect x="0" y="0" width="145" height="86" rx="0" fill="#8A5A35"/>
      <text x="0" y="120" class="label ink">Wood Brown</text>
      <text x="0" y="148" class="small muted">#8A5A35</text>
    </g>
  </g>

  <g transform="translate(80 470)">
    <rect class="card" x="0" y="0" width="460" height="570" rx="0"/>
    <line class="line" x1="38" y1="48" x2="130" y2="48"/>
    <text x="38" y="95" class="label gold">RECOMMENDED</text>
    <text x="38" y="150" class="heading-serif ink">
      <tspan x="38" dy="0">Elegant</tspan>
      <tspan x="38" dy="62">Showroom</tspan>
    </text>
    <text x="38" y="222" class="body muted">Heading: refined serif</text>
    <text x="38" y="258" class="body muted">Body: clean modern sans</text>
    <text x="38" y="325" class="body ink">
      <tspan x="38" dy="0">Curtains, Blinds,</tspan>
      <tspan x="38" dy="34">Wallpaper &amp; Decor</tspan>
      <tspan x="38" dy="34">in Bloemfontein</tspan>
    </text>
    <text x="38" y="430" class="small muted">
      <tspan x="38" dy="0">Established in 1959, Free State Curtain</tspan>
      <tspan x="38" dy="28">Parlour helps you choose curtains, blinds,</tspan>
      <tspan x="38" dy="28">wallpaper, furniture and decor finishes.</tspan>
    </text>
    <rect x="38" y="492" width="172" height="48" rx="0" fill="#151515"/>
    <text x="64" y="523" class="button-text white">Visit Showroom</text>
    <rect x="224" y="492" width="132" height="48" rx="0" fill="#B9965B"/>
    <text x="254" y="523" class="button-text ink">Call Us</text>
  </g>

  <g transform="translate(570 470)">
    <rect class="dark-card" x="0" y="0" width="460" height="570" rx="0"/>
    <line x1="38" y1="48" x2="130" y2="48" stroke="#B9965B" stroke-width="3"/>
    <text x="38" y="95" class="label gold">ALTERNATIVE 1</text>
    <text x="38" y="146" class="heading-sans white">
      <tspan x="38" dy="0">Modern</tspan>
      <tspan x="38" dy="58">Classic</tspan>
    </text>
    <text x="38" y="220" class="body" fill="#D8C7AE">Heading: confident sans</text>
    <text x="38" y="256" class="body" fill="#D8C7AE">Body: same sans family</text>
    <text x="38" y="324" class="body white">
      <tspan x="38" dy="0">Curtains, Blinds,</tspan>
      <tspan x="38" dy="34">Wallpaper &amp; Decor</tspan>
      <tspan x="38" dy="34">in Bloemfontein</tspan>
    </text>
    <text x="38" y="430" class="small" fill="#D8C7AE">
      <tspan x="38" dy="0">This option feels cleaner and slightly more</tspan>
      <tspan x="38" dy="28">contemporary, while still using the black,</tspan>
      <tspan x="38" dy="28">grey, beige and gold palette.</tspan>
    </text>
    <rect x="38" y="492" width="174" height="48" rx="0" fill="#F7F4EC"/>
    <text x="64" y="523" class="button-text ink">Visit Showroom</text>
    <rect x="226" y="492" width="132" height="48" rx="0" fill="#B9965B"/>
    <text x="256" y="523" class="button-text ink">Call Us</text>
  </g>

  <g transform="translate(1060 470)">
    <rect class="card" x="0" y="0" width="460" height="570" rx="0"/>
    <line class="line" x1="38" y1="48" x2="130" y2="48"/>
    <text x="38" y="95" class="label gold">ALTERNATIVE 2</text>
    <text x="38" y="146" class="heading-trad ink">
      <tspan x="38" dy="0">Heritage</tspan>
      <tspan x="38" dy="58">Classic</tspan>
    </text>
    <text x="38" y="220" class="body muted">Heading: traditional serif</text>
    <text x="38" y="256" class="body muted">Body: soft readable sans</text>
    <text x="38" y="324" class="body-serif ink">
      <tspan x="38" dy="0">Curtains, Blinds,</tspan>
      <tspan x="38" dy="34">Wallpaper &amp; Decor</tspan>
      <tspan x="38" dy="34">in Bloemfontein</tspan>
    </text>
    <text x="38" y="430" class="small muted">
      <tspan x="38" dy="0">This feels established and formal. It suits</tspan>
      <tspan x="38" dy="28">the 1959 heritage, but may feel heavier if</tspan>
      <tspan x="38" dy="28">used too much across the homepage.</tspan>
    </text>
    <rect x="38" y="492" width="172" height="48" rx="0" fill="#151515"/>
    <text x="64" y="523" class="button-text white">Visit Showroom</text>
    <rect x="224" y="492" width="132" height="48" rx="0" fill="#D8C7AE"/>
    <text x="254" y="523" class="button-text ink">Call Us</text>
  </g>

  <g transform="translate(80 1090)">
    <text x="0" y="0" class="label ink">Recommendation:</text>
    <text x="170" y="0" class="small muted">Use Elegant Showroom: refined serif headings, clean sans body copy, black/off-white base, gold used sparingly.</text>
  </g>
</svg>
